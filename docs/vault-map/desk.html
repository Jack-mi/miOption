<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#070b10" />
  <title>miOption seller desk</title>
  <meta name="description" content="本地卖方研究台：bull put / bear call 扫描、裁决、监控。不下单。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="map.css" />
  <link rel="stylesheet" href="desk.css" />
</head>
<body>
  <div class="shell">
    <div class="rails" aria-hidden="true"></div>

    <nav class="nav-min" aria-label="子页面">
      <a class="wordmark" href="index.html">mioption</a>
      <ul>
        <li><a href="desk.html" aria-current="page">研究台</a></li>
        <li><a href="chain.html">行情</a></li>
        <li><a href="chat.html">对话</a></li>
      </ul>
    </nav>

    <section class="band" id="desk" aria-labelledby="desk-h">
      <div class="band-head">
        <p class="label">卖方研究台</p>
        <h2 id="desk-h">seller desk<span class="period" aria-hidden="true"></span></h2>
        <p class="meta">本地信用垂直价差：bull put / bear call。输入 nvidia / NVDA / US.NVDA 只扫这一只。不是 OSM.AI，也不会从这页下单。</p>
      </div>
      <p class="desk-status" data-state="down">正在连接本机 <code>/api/health</code>…</p>
      <form class="desk-form" action="#">
        <div class="desk-toolbar">
          <label class="desk-field">
            <span>搜索标的</span>
            <input name="underlyings" value="" placeholder="nvidia / NVDA / US.NVDA" autocomplete="off" />
          </label>
          <div class="desk-actions">
            <button type="submit" data-act="scan">扫描</button>
            <button type="button" data-act="refresh">刷新</button>
            <button type="button" data-act="monitor">监控</button>
          </div>
        </div>
      </form>
      <div class="desk-filters" role="toolbar" aria-label="卡片筛选">
        <button type="button" data-filter="all" aria-pressed="true">全部</button>
        <button type="button" data-filter="signal" aria-pressed="false">信号</button>
        <button type="button" data-filter="tracked" aria-pressed="false">已跟踪</button>
        <button type="button" data-filter="bull_put_spread" aria-pressed="false">Bull Put</button>
        <button type="button" data-filter="bear_call_spread" aria-pressed="false">Bear Call</button>
      </div>
      <div class="desk-cards" aria-live="polite"></div>
      <div class="desk-events">
        <h3>监控事件</h3>
        <ol class="desk-event-list"></ol>
      </div>
    </section>

    <footer class="foot-line">
      <p>研究台不下单 · <a href="chain.html">行情</a> · <a href="chat.html">对话</a> · <a href="index.html">返回知识地图</a></p>
    </footer>
  </div>
  <script src="desk.js?v=5"></script>
</body>
</html>
