<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#070b10" />
  <title>miOption chat</title>
  <meta name="description" content="本机 OpenCode 对话。策略问答与探盘，不下单。" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="map.css" />
  <link rel="stylesheet" href="chat.css" />
</head>
<body class="chat-app">
  <nav class="nav-min" aria-label="子页面">
    <a class="wordmark" href="index.html">mioption</a>
    <ul>
      <li><a href="desk.html">研究台</a></li>
      <li><a href="chain.html">行情</a></li>
      <li><a href="chat.html" aria-current="page">对话</a></li>
    </ul>
  </nav>

  <div class="gpt" id="chat">
    <aside class="gpt-rail">
      <button type="button" class="gpt-new" data-act="new">新对话</button>
      <ol class="gpt-sessions" aria-label="会话列表"></ol>
      <p class="chat-status">连接本机 OpenCode…</p>
    </aside>
    <section class="gpt-stage">
      <header class="gpt-head">
        <button type="button" class="gpt-rail-toggle" aria-controls="chat" aria-expanded="false">会话</button>
        <h1 class="gpt-title">新对话</h1>
      </header>
      <div class="gpt-empty">
        <h2>有什么想问的</h2>
        <p>策略含义、探盘、研究台卡片。这页不下单。</p>
      </div>
      <div class="chat-log" role="log" aria-live="polite" hidden></div>
      <form class="chat-form">
        <label class="gpt-composer">
          <span class="visually-hidden">问题</span>
          <textarea name="prompt" rows="1" placeholder="问策略含义、行情或研究台卡片；不下单" required></textarea>
          <button type="submit">发送</button>
        </label>
      </form>
    </section>
  </div>
  <script src="chat.js?v=5"></script>
</body>
</html>
