# signal_chain v0.1 配置 —— 所有模型在此显式钉版，不继承本机交互端默认。

models:
  synthesis: "deepseek-flash"
  reporter: "deepseek-flash"

watchlist:
  - "US.AAPL"

synthesis:
  aligned_boost: 1.2                  # aligned 时 conviction 上浮系数（封顶 ±1）
  single_source_discount: 0.7
  max_asof_gap_days: 1                # 信号间 as_of 允许的最大交易日差（v1 用自然日近似）

risk:
  earnings_blackout_days: 10          # 财报窗口内禁止 short-vol 结构
  ex_div_blackout_days: 5             # 除息窗口内禁止 short-vol 结构（提前指派风险）
  iv_hv_rising_ratio: 1.15            # IV/HV 比值达到该值算 rising（仅当链判不出方向时才用）
  min_open_interest: 100              # 单腿最低持仓量
  max_spread_pct: 0.10                # 单腿 (ask-bid)/mid 上限
  auto_account_equity: true           # 美股用总资产折美元；没有汇率时用 usd_assets 并注明
  max_position_risk_pct: 0.05         # 单标的新结构最大亏损占权益比
  dte_min: 4
  dte_max: 60
  widths: [2.5, 5.0, 10.0, 20.0]
  min_credit_risk_ratio: 0.10
  min_conviction: 0.4
  drawdown_pct: 0.10
  quote_max_age_seconds: 60
  account_max_age_seconds: 300

chain:
  expiry_window_days: 60              # 取链范围
  dividends_scan_days: 60             # 缺未来除息时，按天扫派息日历的天数（只扫工作日）
  futu_opend_host: "127.0.0.1"
  futu_opend_port: 11111
